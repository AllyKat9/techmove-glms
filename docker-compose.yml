services:
  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: glms-sql-server
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - glms-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$SA_PASSWORD -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 30s
      retries: 20
      start_period: 60s

  glms-backend-api:
    build:
      context: .
      dockerfile: TechMoveGLMS.API/Dockerfile
    container_name: glms-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sql-server-db;Database=TechMoveGLMS_API;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=TechMoveGLMS.API
      - Jwt__Audience=TechMoveGLMS.Web
      - DemoCredentials__Username=admin
      - DemoCredentials__Password=${DEMO_PASSWORD}
      - ExchangeRateApi__ApiKey=${EXCHANGE_API_KEY}
    ports:
      - "5000:80"
    depends_on:
      sql-server-db:
        condition: service_healthy
    networks:
      - glms-network

  glms-frontend-web:
    build:
      context: .
      dockerfile: TechMoveGLMS-Web/Dockerfile
    container_name: glms-web
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ApiSettings__BaseUrl=http://glms-backend-api
    ports:
      - "8080:80"
    depends_on:
      - glms-backend-api
    networks:
      - glms-network

networks:
  glms-network:
    driver: bridge

volumes:
  sql_data: